name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Built before the tests: src/e2e/cli.test.ts and src/cli/bin-entry.test.ts
      # spawn dist/cli/index.js as a separate process.
      - name: Build
        run: npm run build

      - name: Test (with coverage, per-file thresholds enforced)
        run: npm run test:coverage

      # Dogfooding: cachelens gates its own repo. `fixtures/demo-agent/fixed.jsonl`
      # is the golden "fixed" trace from the naive-vs-fixed demo dataset — its
      # cache hit rate is a known-good ~86%, so this is a real CI gate, not a
      # no-op. A regression in the diagnostic or aggregation logic that
      # dropped fixed's hit rate below the threshold would fail this step.
      - name: Self-check (cachelens gating its own demo trace)
        run: node dist/cli/index.js check fixtures/demo-agent/fixed.jsonl --min-hit-rate 80

      # `proxy` is wired but not exercised above (it needs a live upstream
      # to say anything meaningful, which belongs in start-proxy's own
      # test suite, not a CI network dependency). This is a cheap sanity
      # check that the subcommand is actually reachable from the built
      # CLI: it's listed in --help, and calling it without the required
      # output-file argument fails with the documented usage error rather
      # than crashing or hanging.
      - name: Proxy subcommand sanity check (wiring only, no live upstream)
        run: |
          node dist/cli/index.js help | grep -q '^  proxy '
          if node dist/cli/index.js proxy; then
            echo "expected 'cachelens proxy' with no args to fail" >&2
            exit 1
          fi
